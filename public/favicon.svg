<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Base rounded shield/square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Dynamic geometric connectivity nodes (Material Master Graph theme) -->
  <circle cx="16" cy="16" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="48" cy="16" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="48" cy="48" r="3" fill="#10B981" opacity="0.8"/>
  <circle cx="16" cy="48" r="3" fill="#6366F1" opacity="0.8"/>
  
  <line x1="16" y1="16" x2="48" y2="16" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="48" y1="16" x2="48" y2="48" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="48" y1="48" x2="16" y2="48" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="16" y1="48" x2="16" y2="16" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  
  <!-- Central NM Typography / Monogram -->
  <text x="32" y="39" font-family="'IBM Plex Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">NM</text>
  
  <!-- Bottom status / national accent bar -->
  <rect x="22" y="44" width="20" height="2.5" rx="1.25" fill="url(#goldGrad)"/>
</svg>
